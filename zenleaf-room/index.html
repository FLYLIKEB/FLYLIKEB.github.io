<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>선립 · 茶空間 — 지우의 방</title>
<meta name="description" content="차와 음악, 개발과 기록이 있는 방. 선립(@zenleaf.log)의 3D 인터랙티브 룸 프로토타입." />
<meta name="theme-color" content="#f0e6d6" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css" rel="stylesheet">
<style>
  :root{
    --green-bg:#2d5005;
    --green-deep:#274604;
    --green-soft:#3a6110;
    --white:#ffffff;
    --w90:rgba(255,255,255,.9);
    --w70:rgba(255,255,255,.7);
    --w50:rgba(255,255,255,.5);
    --w24:rgba(255,255,255,.24);
    --w14:rgba(255,255,255,.14);
    --pixel:'Galmuri11','Galmuri14','DungGeunMo','Apple SD Gothic Neo',monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    font-family:var(--pixel);
    color:var(--white);
    background:var(--green-bg);
    overflow:hidden;overscroll-behavior:none;
    -webkit-font-smoothing:none;
    letter-spacing:.02em;
  }
  #stage{position:fixed;inset:0;z-index:0}
  #stage canvas{display:block;width:100%;height:100%;touch-action:none}
  .vignette{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(120% 95% at 50% 45%, rgba(0,0,0,0) 58%, rgba(18,32,2,.45) 100%);
    opacity:0;transition:opacity 1.2s ease .2s;
  }
  body.entered .vignette{opacity:1}

  /* ---------- splash ---------- */
  #splash{
    position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:28px;
    background:var(--green-bg);
    transition:opacity .9s ease, visibility .9s ease;
  }
  #splash.gone{opacity:0;visibility:hidden}
  .leaves{width:64px;height:52px;margin-bottom:26px;opacity:.95}
  .splash-title{
    font-size:34px;letter-spacing:.18em;margin:0;color:var(--white);font-weight:normal;
  }
  .splash-sub{font-size:12.5px;letter-spacing:.22em;color:var(--w70);margin:12px 0 0}
  .splash-rule{display:none}
  .audio-note{font-size:11.5px;color:var(--w50);margin:34px 0 18px;line-height:1.7}
  .enter-btn{
    appearance:none;cursor:pointer;font-family:var(--pixel);font-size:13px;letter-spacing:.14em;
    color:var(--white);background:transparent;border:1px solid var(--w50);border-radius:0;
    padding:13px 28px 14px;transition:background .2s ease,color .2s ease,border-color .2s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .enter-btn:hover{background:var(--white);color:var(--green-deep);border-color:var(--white)}
  .enter-btn .tri{display:inline-block;margin-left:10px;animation:blink 1.1s steps(2,end) infinite}
  @keyframes blink{50%{opacity:0}}
  .splash-foot{position:absolute;bottom:22px;left:0;right:0;font-size:10.5px;color:var(--w50);letter-spacing:.14em}
  .load-note{font-size:10.5px;color:var(--w50);margin-top:16px;min-height:14px}

  /* ---------- top bar ---------- */
  #topbar{
    position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
    padding:18px clamp(14px,3vw,30px);pointer-events:none;gap:14px;
    opacity:0;transform:translateY(-8px);transition:opacity .7s ease .3s,transform .7s ease .3s;
  }
  body.entered #topbar{opacity:1;transform:none}
  .brand{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--w90);white-space:nowrap}
  .brand .mini{width:16px;height:14px;margin-right:2px;opacity:.9}
  .brand em{font-style:normal;color:var(--w50);font-size:11px;letter-spacing:.1em}
  #nav{display:flex;gap:clamp(10px,1.8vw,22px);pointer-events:auto;flex-wrap:wrap;justify-content:flex-end;transition:opacity .25s ease}
  body.modal-open #nav{opacity:0;pointer-events:none}
  .nav-btn{
    appearance:none;cursor:pointer;font-family:var(--pixel);font-size:11.5px;letter-spacing:.14em;
    color:var(--w70);background:transparent;border:0;border-bottom:1px solid transparent;
    padding:6px 1px 5px;transition:color .2s ease,border-color .2s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .nav-btn:hover{color:var(--white)}
  .nav-btn.active{color:var(--white);border-bottom-color:var(--white)}

  /* ---------- bottom ---------- */
  #hint{
    position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:20;
    font-size:10.5px;color:var(--w70);text-align:center;white-space:nowrap;letter-spacing:.1em;
    opacity:0;transition:opacity .7s ease 1s;
  }
  body.entered #hint{opacity:1}
  body.hinted #hint{opacity:0}
  #mute{
    position:fixed;right:clamp(14px,3vw,30px);bottom:16px;z-index:21;width:40px;height:40px;border-radius:50%;
    border:1px solid var(--w24);background:rgba(39,70,4,.55);color:var(--w90);
    display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(4px);
    opacity:0;transform:translateY(8px);transition:opacity .7s ease 1s,transform .7s ease 1s,background .2s;
    -webkit-tap-highlight-color:transparent;
  }
  body.entered #mute{opacity:1;transform:none}
  #mute:hover{background:rgba(58,97,16,.8)}
  #mute svg{width:17px;height:17px}
  #mute .slash{opacity:0;transition:opacity .2s}
  body.muted #mute .slash{opacity:1}

  /* ---------- tooltip ---------- */
  #tooltip{
    position:fixed;z-index:25;pointer-events:none;opacity:0;transform:translate(-50%,-135%);
    transition:opacity .16s ease;white-space:nowrap;
    background:var(--green-deep);border:1px solid var(--w24);border-radius:3px;
    padding:5px 10px 6px;font-size:11px;color:var(--white);
  }
  #tooltip.on{opacity:1}
  #tooltip b{color:var(--white);margin-right:7px;font-weight:normal}
  #tooltip span{color:var(--w70)}

  /* ---------- modal ---------- */
  #modal{
    position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end;
    pointer-events:none;opacity:0;transition:opacity .28s ease;
  }
  #modal.open{pointer-events:auto;opacity:1}
  .scrim{position:absolute;inset:0;background:rgba(20,34,3,.45);opacity:0;transition:opacity .35s ease}
  #modal.open .scrim{opacity:1}
  .panel{
    position:relative;width:min(660px,54vw);height:calc(100% - 56px);margin:28px 26px 28px 0;
    display:flex;flex-direction:column;overflow:hidden;
    background:var(--green-bg);
    border:1px solid var(--w24);border-radius:4px;
    box-shadow:0 24px 60px rgba(10,20,0,.45);
    transform:translateX(18px);opacity:.5;
    transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .25s ease;
  }
  #modal.open .panel{transform:none;opacity:1}
  .badge{
    position:absolute;left:26px;top:19px;z-index:3;display:flex;align-items:center;gap:8px;
    font-size:11px;color:var(--w70);letter-spacing:.1em;background:none;border:0;padding:0;
  }
  .badge b{font-weight:normal;color:var(--w50)}
  .panel-head{display:flex;align-items:center;justify-content:flex-end;padding:14px 18px 10px;flex:0 0 auto}
  .back{
    appearance:none;cursor:pointer;font-family:var(--pixel);font-size:10.5px;letter-spacing:.14em;
    color:var(--w90);background:transparent;border:1px solid var(--w24);border-radius:2px;
    padding:6px 12px 7px;transition:background .2s,color .2s,border-color .2s;
  }
  .back:hover{background:var(--white);color:var(--green-deep);border-color:var(--white)}
  .panel-body{padding:2px 26px 52px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;position:relative}
  .panel-body::-webkit-scrollbar{width:6px}
  .panel-body::-webkit-scrollbar-thumb{background:var(--w24);border-radius:3px}
  .cursor{position:absolute;right:20px;bottom:14px;font-size:13px;color:var(--w70);animation:blink 1.1s steps(2,end) infinite;pointer-events:none}

  /* ---------- modal content ---------- */
  .panel h2{font-size:21px;line-height:1.45;margin:4px 0 10px;color:var(--white);font-weight:normal}
  .panel h2 small{font-size:11px;color:var(--w50);margin-left:8px}
  .panel .lede{font-size:12px;line-height:1.95;color:var(--w70);margin:0 0 20px}
  .panel .lede b{color:var(--white);font-weight:normal;border-bottom:1px solid var(--w50);padding-bottom:1px}
  .sec-label{display:flex;align-items:center;gap:12px;margin:24px 0 12px;font-size:10px;color:var(--w50);letter-spacing:.16em}
  .sec-label:after{content:"";flex:1;height:1px;background:var(--w14)}

  .tea-card{border-top:1px solid var(--w14);padding:14px 0 12px;margin:0}
  .tea-card:first-of-type{border-top:0}
  .card-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .no{font-size:10px;color:var(--w50);letter-spacing:.1em}
  .card-head h3{font-size:14px;margin:0;color:var(--white);font-weight:normal}
  .kind{font-size:10px;color:var(--w50);margin-left:auto;letter-spacing:.06em}
  .note{font-size:11.5px;line-height:1.8;color:var(--w70);margin:8px 0 0}
  .axes{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:4px}
  .axes li{display:grid;grid-template-columns:50px 1fr 30px;gap:8px;align-items:center;font-size:10.5px;color:var(--w70)}
  .gauge{display:flex;gap:2px}
  .gauge i{width:8px;height:9px;background:rgba(255,255,255,.18);display:block}
  .gauge i.on{background:var(--white)}
  .axes b{font-size:10.5px;color:var(--white);text-align:right;font-weight:normal}
  .tags{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0 0}
  .tag{font-size:10px;color:var(--w70);border:1px solid var(--w24);border-radius:2px;padding:1px 6px}
  .no-score{font-size:10.5px;color:var(--w50);margin:8px 0 0}

  .track{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--w14)}
  .track:first-of-type{border-top:0}
  .track .n{font-size:10px;color:var(--w50)}
  .track .t{font-size:12.5px;color:var(--white)}
  .track .a{font-size:10.5px;color:var(--w50);margin-top:3px}
  .track .pair{font-size:10px;color:var(--white);border:1px solid var(--w24);border-radius:2px;padding:2px 7px;white-space:nowrap}
  .track .pair span{display:block;font-size:9px;color:var(--w50);margin-bottom:1px}

  .series{display:grid;gap:6px}
  .series-row{display:grid;grid-template-columns:88px 1fr 18px;gap:9px;align-items:center;font-size:11px;color:var(--w70)}
  .series-row b{font-size:11px;color:var(--white);text-align:right;font-weight:normal}
  .reel{padding:10px 0;border-top:1px solid var(--w14)}
  .reel:first-of-type{border-top:0}
  .reel .big{font-size:12.5px;line-height:1.7;color:var(--white)}
  .reel .sub{font-size:10.5px;color:var(--w50);margin-top:4px}
  .reel .views{display:inline-block;font-size:10px;color:var(--green-deep);background:var(--white);padding:1px 5px;margin-right:7px}

  .feature{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin:0}
  .feature div{font-size:10.5px;color:var(--w70);line-height:1.7;padding-left:12px;position:relative}
  .feature div:before{content:"";position:absolute;left:0;top:6px;width:4px;height:4px;background:var(--white);opacity:.7}
  .feature b{display:block;font-size:11px;color:var(--white);font-weight:normal;margin-bottom:1px}
  .log{margin:0;padding:0;list-style:none}
  .log li{display:grid;grid-template-columns:58px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--w14);font-size:11px;color:var(--w70);line-height:1.65}
  .log li:first-child{border-top:0}
  .log time{font-size:10px;color:var(--w50)}

  .handles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0}
  .handle{border:1px solid var(--w14);border-radius:2px;padding:10px 10px 9px}
  .handle .role{font-size:9px;color:var(--w50);letter-spacing:.12em}
  .handle .id{font-size:11.5px;color:var(--white);margin:6px 0 4px;word-break:break-all}
  .handle .desc{font-size:10px;color:var(--w70);line-height:1.6}
  .panel .quote{
    font-size:11.5px;line-height:1.9;color:var(--w70);
    border-left:1px solid var(--w50);padding:2px 0 2px 14px;margin:22px 0 0;
  }
  .panel .foot{font-size:9.5px;color:var(--w50);margin-top:24px;letter-spacing:.1em}

  @media (max-width:820px){
    #topbar{padding:calc(12px + env(safe-area-inset-top)) 14px calc(8px + env(safe-area-inset-top));flex-direction:column;align-items:stretch;gap:8px}
    #nav{gap:8px;justify-content:space-between}
    .nav-btn{font-size:10px;letter-spacing:.08em;flex:1;text-align:center;padding:0;min-height:40px;display:flex;align-items:center;justify-content:center}
    .brand{font-size:11px;align-self:flex-start}
    /* 모바일: 컴팩트 하단 시트 — 3D 방/포커스 오브제가 화면 윗부분에 보이도록 높이 제한 */
    .panel{width:100%;height:50vh;height:50dvh;max-height:50vh;margin:auto 0 0;border-radius:10px 10px 0 0;border-left:0;border-right:0;border-bottom:0;transform:translateY(24px);padding-bottom:env(safe-area-inset-bottom)}
    .badge{left:16px;top:16px;font-size:10px}
    .panel-head{padding:10px 14px 6px}
    .back{font-size:11px;padding:9px 16px 10px;min-height:40px}
    .panel-body{padding:2px 16px calc(46px + env(safe-area-inset-bottom))}
    .cursor{bottom:calc(14px + env(safe-area-inset-bottom))}
    #mute{bottom:calc(12px + env(safe-area-inset-bottom))}
    .panel h2{font-size:18px}
    .feature{grid-template-columns:1fr}
    .handles{grid-template-columns:1fr}
    .series-row{grid-template-columns:72px 1fr 16px;font-size:10.5px}
    #hint{bottom:66px;font-size:9.5px}
    #mute{right:12px;width:40px;height:40px}
    .track{grid-template-columns:20px 1fr;gap:8px}
    .track .pair{grid-column:2;justify-self:start;margin-top:4px}
    .axes li{grid-template-columns:44px 1fr 28px}
    .gauge i{width:7px;height:8px}
  }
</style>
</head>
<body>

<div id="stage"></div>
<div class="vignette"></div>

<header id="topbar">
  <div class="brand"><svg class="mini" viewBox="0 0 64 52" fill="currentColor" aria-hidden="true"><path d="M18 3c7 2 11 8 11 15-7-1-11-7-11-15z"/><path d="M35 9c7 2 11 8 11 15-7-1-11-7-11-15z"/><path d="M14 20c7 2 11 8 11 15-7-1-11-7-11-15z"/></svg>선립 <em>茶空間</em></div>
  <nav id="nav" aria-label="방 안의 오브제">
    <button class="nav-btn" data-key="tea">TEA</button>
    <button class="nav-btn" data-key="music">MUSIC</button>
    <button class="nav-btn" data-key="dev">DEV</button>
    <button class="nav-btn" data-key="reels">REELS</button>
    <button class="nav-btn" data-key="contact">CONTACT</button>
  </nav>
</header>

<div id="hint">드래그로 둘러보기 · 오브제를 눌러 보세요</div>

<div id="tooltip"><b></b><span></span></div>

<button id="mute" aria-label="사운드 끄기" aria-pressed="false">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true">
    <path d="M4 9.5h3L12 5.5v13L7 14.5H4z"/>
    <path class="wave" d="M15.4 9.2a3.9 3.9 0 0 1 0 5.6"/>
    <path class="wave" d="M17.9 6.6a7.5 7.5 0 0 1 0 10.8"/>
    <path class="slash" d="M3.2 3.2 20.8 20.8"/>
  </svg>
</button>

<div id="modal" aria-hidden="true" role="dialog" aria-modal="true" aria-label="방 안의 내용">
  <div class="scrim" data-close="1"></div>
  <div class="panel">
    <div class="badge"><b id="modalIdx">01</b><span id="modalKicker">TEA</span></div>
    <div class="panel-head">
      <button class="back" id="modalBack">← BACK</button>
    </div>
    <div class="panel-body" id="modalBody"></div>
    <div class="cursor">▼</div>
  </div>
</div>

<div id="splash">
  <svg class="leaves" viewBox="0 0 64 52" aria-hidden="true" fill="#ffffff">
    <path d="M18 3c7 2 11 8 11 15-7-1-11-7-11-15z"/>
    <path d="M35 9c7 2 11 8 11 15-7-1-11-7-11-15z"/>
    <path d="M14 20c7 2 11 8 11 15-7-1-11-7-11-15z"/>
  </svg>
  <h1 class="splash-title">선립의 방</h1>
  <p class="splash-sub">茶 · 空間 · 開發</p>
  <p class="audio-note">Best experienced with your device's audio enabled.</p>
  <button class="enter-btn" id="enterBtn">[ CLICK TO ENTER ]<span class="tri">▼</span></button>
  <div class="load-note" id="loadNote">방을 데우는 중…</div>
  <div class="splash-foot">@zenleaf.log · 茶空間</div>
</div>
</div>

<noscript>
  <div style="position:fixed;inset:0;z-index:99;background:#fff8e8;color:#4a3524;display:flex;align-items:center;justify-content:center;padding:32px;text-align:center;font-family:monospace">
    이 페이지는 자바스크립트가 켜져 있어야 방이 열립니다.
  </div>
</noscript>


<script>
(function () {
  'use strict';

  /* ============================================================
     01. DATA — 노션 「차 테이스팅 노트」 실데이터 · 채널 실측

  function box(w, h, d, mat, x, y, z) {
    var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    m.position.set(x, y, z);
    m.castShadow = true;
    m.receiveShadow = true;
    return m;
  }
  function cyl(rt, rb, h, seg, mat, x, y, z) {
    var m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
    m.position.set(x, y, z);
    m.castShadow = true;
    m.receiveShadow = true;
    return m;
  }
  function sph(r, mat, x, y, z, seg) {
    var m = new THREE.Mesh(new THREE.SphereGeometry(r, seg || 18, seg || 14), mat);
    m.position.set(x, y, z);
    m.castShadow = true;
    m.receiveShadow = true;
    return m;
  }
  function plane(w, h, mat, x, y, z) {
    var m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
    m.position.set(x, y, z);
    m.receiveShadow = true;
    return m;
  }
  function lathe(pts, seg, mat) {
    var v = pts.map(function (p) { return new THREE.Vector2(p[0], p[1]); });
    var m = new THREE.Mesh(new THREE.LatheGeometry(v, seg), mat);
    m.castShadow = true;
    m.receiveShadow = true;
    return m;
  }

  function pipe(p1, p2, r, mat) {
    var dir = new THREE.Vector3().subVectors(p2, p1);
    var len = dir.length();
    var m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 8), mat);
    m.position.copy(p1).add(p2).multiplyScalar(0.5);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
    m.castShadow = true;
    return m;
  }

  function lightFloorTexture() {
    var t = tex2d(512, 512, function (x, w, h) {
      x.fillStyle = '#bf9a70';
      x.fillRect(0, 0, w, h);
      var rows = 5, rh = h / rows;
      for (var r = 0; r < rows; r++) {
        var y0 = r * rh;
        var v = 0.94 + Math.random() * 0.1;
        x.fillStyle = 'rgba(' + Math.round(191 * v) + ',' + Math.round(154 * v) + ',' + Math.round(112 * v) + ',1)';
        x.fillRect(0, y0, w, rh - 2);
        for (var i = 0; i < 18; i++) {
          x.beginPath();
          var yy = y0 + 5 + Math.random() * (rh - 10);
          x.moveTo(0, yy);
          for (var sx = 0; sx <= w; sx += 40) {
            x.quadraticCurveTo(sx - 20, yy + Math.sin(sx * 0.02 + i) * 3, sx, yy + Math.cos(sx * 0.017 + i) * 2);
          }
          x.strokeStyle = 'rgba(120,86,54,' + (0.04 + Math.random() * 0.06) + ')';
          x.lineWidth = 0.7 + Math.random() * 1.2;
          x.stroke();
        }
        x.fillStyle = 'rgba(120,88,56,0.35)';
        x.fillRect(0, y0 + rh - 2, w, 2);
        var jx = (r % 2 === 0 ? 0.55 : 0.18) * w;
        x.fillStyle = 'rgba(120,88,56,0.28)';
        x.fillRect(jx, y0, 2, rh - 2);
      }
    });
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(2.6, 2.2);
    t.anisotropy = 4;
    return t;
  }

  function daySkyTexture() {

      x.fillStyle = g;

      // 구름 (작은 뭉치 여러 개)

          var cg = x.createRadialGradient(qx, qy, 0, qx, qy, qw);
          cg.addColorStop(0, 'rgba(255,255,255,' + (0.1 + Math.random() * 0.1) + ')');
          cg.addColorStop(1, 'rgba(255,255,255,0)');
          x.fillStyle = cg;
          x.beginPath();
          x.ellipse(qx, qy, qw, qh, 0, 0, Math.PI * 2);
          x.fill();
        }
      }

      // 도시 (아래쪽)
      var baseY = h * 0.9;
      for (var b = 0; b < 46; b++) {
        var bw = 14 + Math.random() * 34;
        var bh = 22 + Math.random() * 92;
        var bx = Math.random() * w;

        x.fillRect(bx, baseY - bh, bw, bh + 60);

          for (var wx = 0; wx < bw - 6; wx += 8) {
            if (Math.random() < 0.35) {
              x.fillStyle = 'rgba(240,246,255,' + (0.1 + Math.random() * 0.2) + ')';
              x.fillRect(bx + 4 + wx, baseY - bh + 5 + wy, 3, 3);
            }
          }
        }
      }
      x.fillStyle = 'rgba(232,224,208,0.55)';
      x.fillRect(0, h * 0.9, w, h * 0.1);
    });

  function buildRoom() {

    g.add(plane(10, 4.6, MAT.wall, 0, 2.3, -4.2));
    var left = plane(7.2, 4.6, MAT.wall, -5, 2.3, -0.6);

    g.add(left);
    var right = plane(7.2, 4.6, MAT.wall, 5, 2.3, -0.6);
    right.rotation.y = -Math.PI / 2;

    var ceil = plane(10, 7.2, MAT.ceiling, 0, 4.6, -0.6);

  }

  function strelitzia(px, pz, scale) {
    var g = new THREE.Group();
    g.position.set(px, 0, pz);
    g.scale.setScalar(scale || 1);

    g.add(cyl(0.34, 0.26, 0.5, 26, std('#cfc4b4', { rough: 0.95 }), 0, 0.25, 0));
    g.add(cyl(0.35, 0.35, 0.05, 26, std('#bcb0a0', { rough: 0.95 }), 0, 0.5, 0));
    g.add(cyl(0.31, 0.31, 0.02, 26, std('#4b3a2b', { rough: 1 }), 0, 0.52, 0));

    var up = new THREE.Vector3(0, 1, 0);
    var leaves = [
      { a: 0.15, h: 1.75, len: 1.45, wid: 0.50, lean: 0.42, twist: 0.25 },
      { a: 0.95, h: 1.30, len: 1.25, wid: 0.44, lean: 0.52, twist: -0.20 },
      { a: 1.75, h: 2.00, len: 1.50, wid: 0.52, lean: 0.46, twist: 0.10 },
      { a: 2.55, h: 1.50, len: 1.20, wid: 0.42, lean: 0.56, twist: 0.40 },
      { a: 3.35, h: 2.15, len: 1.40, wid: 0.48, lean: 0.40, twist: -0.30 },
      { a: 4.15, h: 1.45, len: 1.15, wid: 0.40, lean: 0.50, twist: 0.20 },
      { a: 4.95, h: 1.85, len: 1.40, wid: 0.50, lean: 0.44, twist: -0.15 },
      { a: 5.70, h: 2.25, len: 1.25, wid: 0.42, lean: 0.36, twist: 0.30 },
      { a: 0.55, h: 1.15, len: 1.00, wid: 0.36, lean: 0.62, twist: 0.05 }
    ];

    leaves.forEach(function (l, i) {
      var baseX = Math.cos(l.a) * 0.1;
      var baseZ = Math.sin(l.a) * 0.1;
      var axis = new THREE.Vector3(
        Math.cos(l.a) * Math.sin(l.lean),
        Math.cos(l.lean),
        Math.sin(l.a) * Math.sin(l.lean)
      ).normalize();
      var base = new THREE.Vector3(baseX, 0.52, baseZ);
      var top = base.clone().addScaledVector(axis, l.h);

      var stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.028, l.h, 7), std('#6f8a4c', { rough: 0.9 }));
      stalk.position.copy(base).addScaledVector(axis, l.h / 2);
      stalk.quaternion.setFromUnitVectors(up, axis);
      stalk.castShadow = true;
      g.add(stalk);

      var leaf = new THREE.Mesh(leafGeometry(l.len, l.wid), i % 3 === 0 ? MAT.greenDark : (i % 2 ? MAT.green2 : MAT.green));
      leaf.position.copy(top);
      leaf.quaternion.setFromUnitVectors(up, axis);
      leaf.rotateY(l.twist);
      leaf.castShadow = true;
      leaf.receiveShadow = true;
      g.add(leaf);

      var rib = new THREE.Mesh(leafGeometry(l.len * 0.97, l.wid * 0.07), std('#3d5f34', { rough: 0.9, side: THREE.DoubleSide }));
      rib.position.copy(top).addScaledVector(new THREE.Vector3(0, 0, 1).applyQuaternion(leaf.quaternion), 0.005);
      rib.quaternion.copy(leaf.quaternion);
      g.add(rib);
    });

    return g;
  }

  /* ============================================================
     08. 인터랙션
     ============================================================ */

  var glowTex;

  function registerPicks() {
    glowTex = glowTexture();
    var keys = ['tea', 'music', 'dev', 'reels', 'contact'];
    keys.forEach(function (k) {
      var grp = groups[k];
      if (!grp) return;
      grp.traverse(function (o) {
        if (o.isMesh) {
          o.userData.pickKey = k;
          pickMeshes.push(o);
        }
      });
      // 발견을 돕는 표시는 호버 하이라이트와 상단 내비게이션이 담당합니다.
    });
  }

  var pointer = { x: 0, y: 0, downX: 0, downY: 0, down: false, moved: false, nx: 0, ny: 0 };
  var parallax = { x: 0, y: 0, tx: 0, ty: 0 };

  function bindPointer() {
    var el = renderer.domElement;

    function setNDC(e) {
      var r = el.getBoundingClientRect();
      pointer.nx = ((e.clientX - r.left) / r.width) * 2 - 1;
      pointer.ny = -((e.clientY - r.top) / r.height) * 2 + 1;
    }

    el.addEventListener('pointerdown', function (e) {
      if (!entered) return;
      el.setPointerCapture(e.pointerId);
      pointer.down = true;
      pointer.moved = false;
      pointer.downX = e.clientX;
      pointer.downY = e.clientY;
      pointer.lastX = e.clientX;
      pointer.lastY = e.clientY;
      document.body.classList.add('hinted');
    });

    el.addEventListener('pointermove', function (e) {
      pointer.movedAny = true;
      setNDC(e);
      if (pointer.down) {
        var dx = e.clientX - (pointer.lastX || e.clientX);
        var dy = e.clientY - (pointer.lastY || e.clientY);
        if (Math.abs(e.clientX - pointer.downX) + Math.abs(e.clientY - pointer.downY) > 10) { pointer.moved = true; }
        if (mode === 'home' && !modalKey) {
          yawT = clamp(yawT - dx * 0.0032, HOME.yaw - 0.62, HOME.yaw + 0.62);
          pitchT = clamp(pitchT + dy * 0.0022, HOME.pitch - 0.16, HOME.pitch + 0.34);
        }
        pointer.lastX = e.clientX;
        pointer.lastY = e.clientY;
      } else if (!isTouch) {
        parallax.tx = (e.clientX / window.innerWidth - 0.5) * 2;
        parallax.ty = (e.clientY / window.innerHeight - 0.5) * 2;
      }
    });

    el.addEventListener('pointerup', function (e) {
      if (!entered) return;
      pointer.down = false;
      // 드래그로 둘러보다가 놓은 경우 탭으로 보지 않는다 (터치 오차를 감안해 임계치 상향)
      var dist = Math.abs(e.clientX - pointer.downX) + Math.abs(e.clientY - pointer.downY);
      if (dist < 12) { handleTap(e.clientX, e.clientY); }
    });

    el.addEventListener('pointercancel', function () { pointer.down = false; });
    el.addEventListener('pointerleave', function () {
      if (!isTouch) { hoverKey = null; hideTooltip(); parallax.tx = 0; parallax.ty = 0; }
    });
  }

  function handleTap(cx, cy) {
    var r = renderer.domElement.getBoundingClientRect();
    var nx = ((cx - r.left) / r.width) * 2 - 1;
    var ny = -((cy - r.top) / r.height) * 2 + 1;
    raycaster.setFromCamera(new THREE.Vector2(nx, ny), camera);
    var hits = raycaster.intersectObjects(pickMeshes, false);
    if (hits.length) {
      var k = hits[0].object.userData.pickKey;
      if (k) { openKey(k); return; }
    }
    if (modalKey) { closeModal(); }
  }

  function updateHover() {
    if (!entered || modalKey || pointer.down || !pointer.movedAny) {
      if (hoverKey) { setHover(null); }
      return;
    }
    raycaster.setFromCamera(new THREE.Vector2(pointer.nx, pointer.ny), camera);
    var hits = raycaster.intersectObjects(pickMeshes, false);
    var k = hits.length ? hits[0].object.userData.pickKey : null;
    if (k !== hoverKey) { setHover(k); }
    if (k && !isTouch) {
      var p = hits[0].point.clone().project(camera);
      var sx = (p.x * 0.5 + 0.5) * window.innerWidth;
      var sy = (-p.y * 0.5 + 0.5) * window.innerHeight;
      showTooltip(k, sx, sy);
    } else {
      hideTooltip();
    }
  }

  var hoveredMats = [];

  function setHover(k) {
    // 이전 하이라이트 복원
    hoveredMats.forEach(function (item) {
      item.mat.emissive.copy(item.emissive);
      item.mat.emissiveIntensity = item.intensity;
    });
    hoveredMats = [];
    hoverKey = k;
    document.body.style.cursor = k ? 'pointer' : '';
    if (!k) { hideTooltip(); return; }
    var grp = groups[k];
    if (!grp) return;
    grp.traverse(function (o) {
      if (!o.isMesh || !o.material) return;
      var mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach(function (m) {
        if (m && m.emissive && m.emissive.isColor) {
          hoveredMats.push({ mat: m, emissive: m.emissive.clone(), intensity: m.emissiveIntensity });
          m.emissive.setHex(0x5c3418);
          m.emissiveIntensity = 0.55;
        }
      });
    });
  }

  function showTooltip(k, x, y) {
    var l = LABELS[k];
    if (!l) return;
    tooltip.querySelector('b').textContent = l[0];
    tooltip.querySelector('span').textContent = l[1];
    tooltip.style.left = x + 'px';
    tooltip.style.top = y + 'px';
    tooltip.classList.add('on');
  }
  function hideTooltip() { tooltip.classList.remove('on'); }

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  // 화면 비율에 따라 기본 시점을 다시 잡습니다 (모바일 세로 화면 대응)
  var homeClass = '';
  function computeHome() {
    if (!HOME) return '';
    var a = window.innerWidth / window.innerHeight;
    var cls;
    if (a < 0.85) {
      cls = 'narrow';
      HOME.look.set(-1.5, 1.5, -3.4);
      HOME.radius = 5.2;
      HOME.yaw = -0.18;
      HOME.pitch = 0.5;
      HOME.fov = 76;
    } else if (a < 1.25) {
      cls = 'mid';
      HOME.look.set(-1.1, 1.45, -3.4);
      HOME.radius = 5.4;
      HOME.yaw = 0.08;
      HOME.pitch = 0.47;
      HOME.fov = 64;
    } else {
      cls = 'wide';
      HOME.look.set(-0.8, 1.2, -3.4);
      HOME.radius = 5.42;
      HOME.yaw = 0.206;
      HOME.pitch = 0.553;
      HOME.fov = 60;
    }
    homeClass = cls;
    return cls;
  }

  var NARROW_SHIFT = { tea: -0.34, music: -0.34, dev: -0.18, reels: -0.28, contact: -0.26 };

  /* ---------- 포커스 ---------- */
  function focusKey(k) {
    var v = VIEWS[k];
    if (!v) return;
    savedYaw = yawT;
    savedPitch = pitchT;
    mode = 'focus';
    viewPos.set(v.pos[0], v.pos[1], v.pos[2]);
    viewLook.set(v.look[0], v.look[1], v.look[2]);
    viewFov = v.fov;
    var narrow = window.innerWidth < 820;
    // 모바일에서는 하단 시트(약 50dvh) 위쪽 절반에 포커스 오브제가 오도록 시점을 위로 민다
    shiftYawT = narrow ? -0.04 : -0.16;
    shiftPitchT = narrow ? (NARROW_SHIFT[k] !== undefined ? NARROW_SHIFT[k] : -0.3) : 0;
  }

  function homeView(now) {
    mode = 'home';
    viewLook.set(HOME.look.x, HOME.look.y, HOME.look.z);
    viewFov = HOME.fov;
    shiftYawT = 0;
    shiftPitchT = 0;
    if (now) {
      yawT = HOME.yaw; pitchT = HOME.pitch;
    }
  }

  /* ---------- 모달 ---------- */
  function openKey(k) {
    if (!MODAL_KICKER[k]) return;
    focusKey(k);
    modalKey = k;
    modalIdx.textContent = ('0' + (MODAL_ORDER.indexOf(k) + 1)).slice(-2);
    modalKicker.textContent = MODAL_KICKER[k];
    modalBody.innerHTML = MODAL_HTML[k]();
    modalBody.scrollTop = 0;
    modalEl.classList.add('open');
    modalEl.setAttribute('aria-hidden', 'false');
    document.body.classList.add('modal-open');
    navEl.querySelectorAll('.nav-btn').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-key') === k);
    });
    setHover(null);
    hideTooltip();
  }

  function closeModal() {
    if (!modalKey) return;
    modalKey = null;
    modalEl.classList.remove('open');
    modalEl.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('modal-open');
    navEl.querySelectorAll('.nav-btn').forEach(function (b) { b.classList.remove('active'); });
    homeView(false);
    yawT = savedYaw;
    pitchT = savedPitch;
  }

  $('modalBack').addEventListener('click', closeModal);
  modalEl.addEventListener('click', function (e) {
    var t = e.target;
    if (t && t.getAttribute && t.getAttribute('data-close')) { closeModal(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeModal(); }
  });
  navEl.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.nav-btn') : null;
    if (!b) return;
    var k = b.getAttribute('data-key');
    if (modalKey === k) { closeModal(); } else { openKey(k); }
  });

  /* ============================================================
     09. 모달 내용

      DEVLOG.forEach(function (d) {

    reels: function () {

      SERIES.forEach(function (s) {

    contact: function () {
      return '' +
        '<h2>창가에서<small>문의</small></h2>' +

        '<div class="desc">일상 속 차의 온기 · 릴스와 사진</div></div>' +

        '<div class="desc">차 · 기물 · 공간 기록 보관소</div></div>' +
        '<div class="handle"><div class="role">DEV</div><div class="id">@samuraiteafox</div>' +
        '<div class="desc">인디게임 〈무차우〉 개발 로그</div></div>' +

        '<div class="sec-label">함께 하기</div>' +
        '<p class="lede" style="margin-bottom:0">차 브랜드 · 다구 · 공간 브랜드와의 협업, 촬영, 인터뷰를 환영합니다. ' +
        '제품은 직접 써 보고 이야기하고, 협찬과 내돈내산은 구분해서 표기합니다.</p>' +
        '<p class="quote">“좋은 차는 혼자 마셔도 좋지만, 누군가에게 따라 줄 때 제일 좋습니다.”</p>' +
        '<p class="foot">선립 · 茶空間 — prototype</p>';

  /* ============================================================
     10. 렌더 루프
     ============================================================ */

  var tmpVec;

  function animate() {
    requestAnimationFrame(animate);
    var dt = Math.min(clock.getDelta(), 0.05);
    var t = clock.elapsedTime;

    // 시점 보간
    var kYaw = 1 - Math.exp(-7 * dt);
    yaw += (yawT - yaw) * kYaw;
    pitch += (pitchT - pitch) * kYaw;

    if (mode === 'home') {
      parallax.x += ((parallax.tx * (reduceMotion ? 0 : 1)) - parallax.x) * (1 - Math.exp(-3 * dt));
      parallax.y += ((parallax.ty * (reduceMotion ? 0 : 1)) - parallax.y) * (1 - Math.exp(-3 * dt));
      var y = yaw + parallax.x * 0.045;
      var p = pitch + parallax.y * 0.022;
      var breathe = reduceMotion ? 0 : Math.sin(t * 0.42) * 0.02;
      viewPos.set(
        HOME.look.x + Math.sin(y) * Math.cos(p) * HOME.radius,
        HOME.look.y + Math.sin(p) * HOME.radius + breathe,
        HOME.look.z + Math.cos(y) * Math.cos(p) * HOME.radius
      );
      viewLook.copy(HOME.look);
      viewFov = HOME.fov;
    }

    var kCam = 1 - Math.exp(-4.2 * dt);
    camera.position.lerp(viewPos, kCam);
    lookSmooth.lerp(viewLook, kCam);
    camera.lookAt(lookSmooth);

    shiftYaw += (shiftYawT - shiftYaw) * kCam;
    shiftPitch += (shiftPitchT - shiftPitch) * kCam;
    if (Math.abs(shiftYaw) > 0.0005) { camera.rotateY(shiftYaw); }
    if (Math.abs(shiftPitch) > 0.0005) { camera.rotateX(shiftPitch); }

    if (Math.abs(camera.fov - viewFov) > 0.01) {
      camera.fov += (viewFov - camera.fov) * kCam;
      camera.updateProjectionMatrix();
    }

    // 바이닐
    if (groups.music && groups.music.userData.platter) {
      groups.music.userData.platter.rotation.y -= dt * 1.35;
    }

    // 핫스팟 숨쉬기
    for (var key in hotspots) {
      if (!hotspots.hasOwnProperty(key)) continue;
      var sp = hotspots[key];
      var base = (modalKey === key) ? 0.06 : 0.26;
      sp.material.opacity = base + Math.sin(t * 1.4 + key.length) * 0.07;
      var s = 0.8 + Math.sin(t * 1.1 + key.length) * 0.06;
      sp.scale.set(s, s, 1);
    }

    updateHover();
    renderer.render(scene, camera);
  }

  function onResize() {
    if (!renderer) return;
    var w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h);
    var before = homeClass;
    var cls = computeHome();
    if (mode === 'home' && cls !== before) {
      yawT = HOME.yaw;
      pitchT = HOME.pitch;
    } else if (mode === 'home') {
      yawT = Math.max(HOME.yaw - 0.62, Math.min(HOME.yaw + 0.62, yawT));
    }
    if (modalKey) {
      var narrow = w < 820;
      shiftYawT = narrow ? -0.04 : -0.16;
      shiftPitchT = narrow ? (NARROW_SHIFT[modalKey] !== undefined ? NARROW_SHIFT[modalKey] : -0.3) : 0;
    }
  }

  /* ============================================================
     11. 시작
     ============================================================ */

  muteBtn.addEventListener('click', function () {
    Audio.setMuted(!Audio.muted);
  });

  enterBtn.addEventListener('click', function () {
    if (!entered) { enter(); }
  });

  function enter() {
    if (!scene) {
      loadNote.textContent = '잠시만요 — 방을 데우는 중입니다.';
      return;
    }
    entered = true;
    splash.classList.add('gone');
    document.body.classList.add('entered');
    Audio.start();
    setTimeout(function () { if (modalEl.classList.contains('open') === false) { document.body.classList.add('hinted'); } }, 7000);
    // 진입 시 살짝 아래에서 올라오기
    camera.position.set(0.4, 4.8, 8.5);
  }

  loadThree(function (err) {
    if (err) {
      loadNote.textContent = '3D 엔진을 불러오지 못했습니다. 네트워크를 확인한 뒤 새로고침해 주세요.';
      return;
    }
    try {
      initThree();
      enterBtn.classList.add('ready');
      loadNote.textContent = '';
    } catch (e) {
      loadNote.textContent = '방을 그리는 중 문제가 생겼습니다: ' + (e && e.message ? e.message : 'unknown');
      if (window.console && console.error) { console.error(e); }
    }
  });

})();
